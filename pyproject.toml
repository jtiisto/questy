[project]
name = "questy"
version = "0.1.0"
description = "Local-first Quest Diagnostics lab data import and MCP server for LLM analysis"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "pdf2image>=1.16.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
# A new fastmcp major is adopted deliberately: the stdio wire contract
# (tool names, schemas, descriptions, results) is re-checked on a major.
mcp = ["fastmcp>=4.0.0,<5.0.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "ruff>=0.1.0"]

[project.scripts]
questy-import = "questy.localdb.cli:main"
questy-mcp = "questy.mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/questy"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# The rule families this repo passes, pinned so the gate does not move with
# ruff's defaults. Line length is not checked (E501 is not selected).
select = [
    "E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "PLW", "PLE", "BLE",
    "PIE", "RET", "C4", "PTH", "N", "ASYNC", "FURB", "LOG",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "personal: tests requiring personal PDF data",
]
